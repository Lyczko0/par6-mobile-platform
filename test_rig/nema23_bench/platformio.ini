; Bench firmware for ONE NEMA23 with a brake on the J1 slot.
;
; Same toolchain and the same library versions as Lyczko0/Parol6-firmware, so
; switching between the two is a rebuild and nothing else. micro-ROS is NOT a
; dependency here - that is the whole point of this firmware.
;
;   pio run -t upload
;   pio device monitor

[env:teensy41]
platform = teensy
board = teensy41
framework = arduino

; Same flag as the arm firmware: force the USB serial device.
build_flags = -D USB_SERIAL

monitor_speed = 115200

lib_deps =
    waspinator/AccelStepper @ ^1.64
    teemuatlut/TMCStepper@^0.7.3
